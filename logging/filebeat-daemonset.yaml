# Ships container logs from both microservices to Elasticsearch/Logstash.
# Requires an ELK/EFK stack running in-cluster or reachable externally:
# Provision Elasticsearch separately and make the service names below reachable.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: microdep
spec:
  selector:
    matchLabels: { app: filebeat }
  template:
    metadata:
      labels: { app: filebeat }
    spec:
      serviceAccountName: filebeat
      securityContext:
        runAsUser: 0
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.14.0
          args: ["-c", "/etc/filebeat.yml", "-e", "--strict.perms=false"]
          env:
            - name: ELASTICSEARCH_HOST
              value: "elasticsearch.logging.svc.cluster.local:9200"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap: { name: filebeat-config }
        - name: varlog
          hostPath: { path: /var/log }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: microdep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: microdep
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: microdep
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*orders-service*.log
          - /var/log/containers/*inventory-service*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"
    output.elasticsearch:
      hosts: ["${ELASTICSEARCH_HOST}"]
      index: "microdep-logs-%{+yyyy.MM.dd}"
    setup.ilm.enabled: false
    setup.template.name: "microdep-logs"
    setup.template.pattern: "microdep-logs-*"
    setup.kibana:
      host: "kibana.logging.svc.cluster.local:5601"
