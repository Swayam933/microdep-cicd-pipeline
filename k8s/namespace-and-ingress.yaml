apiVersion: v1
kind: Namespace
metadata:
  name: microdep
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microdep-ingress
  namespace: microdep
spec:
  ingressClassName: nginx
  rules:
    - host: orders.microdep.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  number: 80
    - host: inventory.microdep.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 80
